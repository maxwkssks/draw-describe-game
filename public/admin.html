<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>그려봐! | 관리자 사진 보관소</title><link rel="stylesheet" href="/styles.css"></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="/" style="text-decoration:none"><span class="brand-icon">✦</span> 그려봐! <small>PHOTO ADMIN</small></a><div class="top-actions"><span class="pill" id="status">관리자 인증 대기</span><a class="btn btn-ghost btn-sm" href="/">← 게임으로</a></div></header><main class="container"><div class="section-heading"><span class="eyebrow">PRIVATE PHOTO LIBRARY</span><h1>🖼 관리자 사진 보관소</h1><p>등록된 사진 중 하나가 라운드마다 무작위로 출제됩니다. 원본은 설명자에게만 공개됩니다.</p></div><section class="panel admin-form"><div id="login-panel"><h3>관리자 로그인</h3><p class="tip">Supabase Authentication에 생성한 관리자 이메일 계정으로 로그인하세요. 일반 참가자는 별도 로그인 없이 참가합니다.</p><div class="form-stack"><div class="field"><label for="email">이메일</label><input id="email" class="input" type="email" autocomplete="username" placeholder="admin@example.com"></div><div class="field"><label for="password">비밀번호</label><input id="password" class="input" type="password" autocomplete="current-password"></div><button id="login" class="btn btn-primary btn-wide">로그인</button></div></div><div id="manager" hidden><div class="row space-between"><h3>사진 업로드</h3><button class="btn btn-secondary btn-sm" id="logout">로그아웃</button></div><div class="field"><label for="photo-name">사진 이름</label><input class="input" id="photo-name" maxlength="120" placeholder="예: 노란 오리"></div><div class="field"><label for="photo-category">사진 카테고리</label><select id="photo-category" class="input"><option value="real_person">실제인물</option><option value="animal">동물</option><option value="soop">SOOP</option><option value="anime_character">애니메이션 캐릭터</option></select></div><div class="field"><label for="photo-file">사진 파일 (JPG · PNG · WEBP / 5MB 이하)</label><input id="photo-file" type="file" accept="image/png,image/jpeg,image/webp"></div><button id="upload" class="btn btn-primary">사진 등록</button><hr style="margin:20px 0;border:0;border-top:1px solid #394059"><div class="row space-between"><h3>등록된 사진 <span id="count"></span></h3><button class="btn btn-secondary btn-sm" id="refresh">새로고침</button></div><div id="photo-list"></div></div><p class="tip" id="notice"></p></section></main><footer class="footer">DRAW & DESCRIBE <span>ADMINISTRATOR</span></footer></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/config.js"></script><script src="/admin.js"></script></body></html>
